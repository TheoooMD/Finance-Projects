  <script>
    (function () {
      var q = function (id) { return document.getElementById(id); };

      /* ---------- virtual camera (viewport-change, PAN mode, scale 1) ---------- */
      var world = q("f5-world");
      var cam = { x: 0, y: 193.5 };
      function applyCamera() {
        world.style.transform = "translate(" + cam.x + "px, " + cam.y + "px)";
      }
      applyCamera();

      /* ---------- scenario data (real terminal output, base case verified
         against assets/screen-model.png) ---------- */
      var SC = {
        pes: { rev: [318.4744, 322.2961], yoy: [2.8, 1.2] },
        base: { rev: [343.2584, 374.8380], yoy: [10.8, 9.2] },
        opt: { rev: [358.7484, 409.6906], yoy: [15.8, 14.2] }
      };
      var MINUS = "−";
      function money(m) {
        var s = Math.abs(m).toFixed(1);
        return (m < 0 ? MINUS : "") + "$" + s + "M";
      }
      function pct(p) {
        return (p < 0 ? MINUS : "") + Math.abs(p).toFixed(1) + "%";
      }

      var revEl = [q("f5-rev-1"), q("f5-rev-2")];
      var yoyEl = [q("f5-yoy-1"), q("f5-yoy-2")];
      var figures = {
        r0: SC.base.rev[0], r1: SC.base.rev[1],
        y0: SC.base.yoy[0], y1: SC.base.yoy[1]
      };
      function writeFigures() {
        revEl[0].textContent = money(figures.r0);
        revEl[1].textContent = money(figures.r1);
        yoyEl[0].textContent = pct(figures.y0);
        yoyEl[1].textContent = pct(figures.y1);
      }
      writeFigures();

      var SEG = {
        pes: { x: -96.1, width: 96.1 },
        base: { x: 0, width: 54.8 },
        opt: { x: 54.8, width: 88.6 }
      };
      var segEl = { pes: q("f5-seg-pes"), base: q("f5-seg-base"), opt: q("f5-seg-opt") };

      var tl = gsap.timeline({ paused: true });

      /* base case is the screenshot's own state — pinned at t=0 */
      tl.to(figures, {
        r0: SC.base.rev[0], r1: SC.base.rev[1],
        y0: SC.base.yoy[0], y1: SC.base.yoy[1],
        duration: 0.01, ease: "none", onUpdate: writeFigures
      }, 0);

      /* =================== SCENE 1 (0.0-2.2) — station one ================== */
      tl.fromTo(q("f5-panel1"), { opacity: 0.55 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
      tl.fromTo(q("f5-cap1"), { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.05);

      /* forecast columns reveal left to right — hard, precise wipes */
      var cols = ["f5-col-a", "f5-col-b", "f5-col-c", "f5-col-d", "f5-col-e"];
      var colAt = [0.45, 0.72, 0.99, 1.33, 1.70];
      cols.forEach(function (id, i) {
        var cov = q(id);
        var p = { v: 0 };
        tl.to(p, {
          v: 1, duration: 0.22, ease: "power3.inOut",
          onUpdate: function () { cov.style.clipPath = "inset(0 0 0 " + (p.v * 100).toFixed(2) + "%)"; }
        }, colAt[i]);
      });

      /* rail steps ANALYZE -> PLAN */
      tl.to(q("f5-railfill"), { height: "60%", duration: 0.5, ease: "power3.inOut" }, 0.90);
      tl.to(q("f5-p-plan"), { color: "#F5B83D", duration: 0.3, ease: "power2.out" }, 0.90);
      tl.to(q("f5-p-analyze"), { opacity: 0.5, duration: 0.3 }, 0.90);

      /* =================== SCENE 2 (2.2-5.0) — the toggle snaps ============= */
      function snap(at, key) {
        var s = SEG[key];
        tl.to(q("f5-pill"), { x: s.x, width: s.width, duration: 0.14, ease: "power3.inOut" }, at);
        ["pes", "base", "opt"].forEach(function (k) {
          tl.to(segEl[k], { color: k === key ? "#120E04" : "#A3A199", duration: 0.1, ease: "none" }, at);
        });
        /* the table re-reads: figures recompute in place, column by column */
        tl.to(figures, {
          r0: SC[key].rev[0], y0: SC[key].yoy[0],
          duration: 0.34, ease: "power3.out", onUpdate: writeFigures
        }, at + 0.04);
        tl.to(figures, {
          r1: SC[key].rev[1], y1: SC[key].yoy[1],
          duration: 0.34, ease: "power3.out", onUpdate: writeFigures
        }, at + 0.10);
      }
      snap(2.50, "pes");
      snap(3.35, "base");
      snap(4.20, "opt");

      /* export model (.xlsx) catches an amber sweep and holds lit */
      var sweep = q("f5-sweep");
      var sp = { v: 0 };
      tl.to(sweep, { opacity: 1, duration: 0.06, ease: "none" }, 4.46);
      tl.to(sp, {
        v: 1, duration: 0.46, ease: "power2.inOut",
        onUpdate: function () { sweep.style.transform = "translateX(" + (-70 + sp.v * 230).toFixed(2) + "px)"; }
      }, 4.46);
      tl.to(sweep, { opacity: 0, duration: 0.08, ease: "none" }, 4.90);
      tl.to(q("f5-export"), { filter: "brightness(1.16)", duration: 0.3, ease: "power2.out" }, 4.60);
      tl.fromTo(q("f5-ring"), { opacity: 0 }, { opacity: 1, duration: 0.28, ease: "power2.out" }, 4.62);

      /* ============ SCENE 3 (5.0-8.2) — one pan down to station two ========= */
      tl.to(cam, { y: -374, duration: 1.60, ease: "power3.inOut", onUpdate: applyCamera }, 5.00);

      /* rail steps PLAN -> DECIDE, kicker follows */
      tl.to(q("f5-railfill"), { height: "80%", duration: 0.5, ease: "power3.inOut" }, 5.20);
      tl.to(q("f5-p-decide"), { color: "#F5B83D", duration: 0.3, ease: "power2.out" }, 5.20);
      tl.to(q("f5-p-plan"), { opacity: 0.5, duration: 0.3 }, 5.20);
      tl.to(q("f5-kick-plan"), { opacity: 0, duration: 0.18, ease: "none" }, 5.20);
      tl.fromTo(q("f5-kick-decide"), { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "none" }, 5.34);

      tl.fromTo(q("f5-cap2"), { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.40);
      tl.fromTo(q("f5-panel2"), { opacity: 0.55 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 5.40);

      /* the two distributions draw in from their centers outward */
      [["f5-d1l", "left"], ["f5-d1r", "right"], ["f5-d2l", "left"], ["f5-d2r", "right"]].forEach(function (pair) {
        var el = q(pair[0]);
        var side = pair[1];
        var p = { v: 0 };
        tl.to(p, {
          v: 1, duration: 0.66, ease: "power2.inOut",
          onUpdate: function () {
            var pc = (p.v * 100).toFixed(2);
            el.style.clipPath = side === "left"
              ? "inset(0 " + pc + "% 0 0)"
              : "inset(0 0 0 " + pc + "%)";
          }
        }, 6.62);
      });

      /* then the P10 / P50 / P90 markers drop into place with their values */
      [["f5-mk-p10", 7.42], ["f5-mk-p50", 7.66], ["f5-mk-p90", 7.90], ["f5-mk-note", 8.06]].forEach(function (m) {
        tl.fromTo(q(m[0]), { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, m[1]);
      });

      /* ========== SCENE 4 (8.2-11.2) — the pan continues to station three === */
      tl.to(cam, { y: -1063, duration: 1.55, ease: "power3.inOut", onUpdate: applyCamera }, 8.20);
      tl.fromTo(q("f5-cap3"), { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 8.60);
      tl.fromTo(q("f5-panel3"), { opacity: 0.55 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 8.60);

      /* NPV, then IRR, then the verdict — each resolving in the product's own red */
      [["f5-fig-npv", 9.95, 0.26], ["f5-fig-irr", 10.45, 0.26], ["f5-fig-dec", 10.95, 0.30]].forEach(function (f) {
        var el = q(f[0]);
        var p = { v: 0 };
        tl.to(p, {
          v: 1, duration: f[2], ease: "power3.inOut",
          onUpdate: function () { el.style.clipPath = "inset(0 0 0 " + (p.v * 100).toFixed(2) + "%)"; }
        }, f[1]);
      });

      /* ========== SCENE 5 (11.2-13.0) — held read, camera fully stopped ===== */
