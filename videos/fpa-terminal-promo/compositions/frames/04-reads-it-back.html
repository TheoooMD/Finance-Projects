  <script src="../../vendor/gsap.min.js"></script>
  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="04-reads-it-back"]');
      if (!root) return;

      /* ---------- measured geometry (screenshot px x 0.33434, offset -37.9 / 143.3) ---------- */
      var TILE_X = [160.0, 272.3, 384.7, 497.0, 609.4, 721.7, 834.1, 946.4];
      var TILE_W = 103.6;

      var KPI = [
        { to: 29.4,  fmt: 'm1', d: '13.7%', dir: 'up' },
        { to: 21.4,  fmt: 'm1', d: '10.0%', dir: 'up' },
        { to: 72.8,  fmt: 'p1', d: '2.5 pts', dir: 'down' },
        { to: 295.8, fmt: 'k1', d: '6.4%',  dir: 'up' },
        { to: 99,    fmt: 'd0', d: '6.9%',  dir: 'up' },
        { to: 1892,  fmt: 'n0', d: '22.1%', dir: 'up' },
        { to: 1367,  fmt: 'n0', d: '19.7%', dir: 'up' },
        { to: 47,    fmt: 'i0', d: '51.6%', dir: 'up' }
      ];

      function comma(n) {
        var s = String(n), out = '', c = 0;
        for (var i = s.length - 1; i >= 0; i--) {
          out = s.charAt(i) + out;
          c++;
          if (c % 3 === 0 && i > 0) out = ',' + out;
        }
        return out;
      }
      function render(v, fmt) {
        if (fmt === 'm1') return '$' + v.toFixed(1) + 'M';
        if (fmt === 'p1') return v.toFixed(1) + '%';
        if (fmt === 'k1') return v.toFixed(1) + 'K';
        if (fmt === 'd0') return '$' + Math.round(v);
        if (fmt === 'n0') return comma(Math.round(v));
        return String(Math.round(v));
      }

      /* ---------- build the KPI overlay ---------- */
      var kpiLayer = root.querySelector('#f04-kpi');
      var valEls = [], deltaEls = [], hairEls = [], counters = [];

      for (var i = 0; i < 8; i++) {
        var x = TILE_X[i];

        var hair = document.createElement('div');
        hair.className = 'f04-hair';
        hair.style.left = x + 'px';
        hair.style.width = TILE_W + 'px';
        kpiLayer.appendChild(hair);
        hairEls.push(hair);

        var vc = document.createElement('div');
        vc.className = 'f04-cover';
        vc.style.left = (x + 3) + 'px';
        vc.style.top = '391.4px';
        vc.style.width = (TILE_W - 6) + 'px';
        vc.style.height = '19.4px';
        kpiLayer.appendChild(vc);

        var dc = document.createElement('div');
        dc.className = 'f04-cover';
        dc.style.left = (x + 3) + 'px';
        dc.style.top = '414.1px';
        dc.style.width = (TILE_W - 6) + 'px';
        dc.style.height = '15.4px';
        kpiLayer.appendChild(dc);

        var v = document.createElement('div');
        v.className = 'f04-val';
        v.style.left = (x + 10.7) + 'px';
        v.style.top = '391.0px';
        v.style.transformOrigin = 'left center';
        v.textContent = render(0, KPI[i].fmt);
        kpiLayer.appendChild(v);
        valEls.push(v);
        counters.push({ v: 0 });

        var d = document.createElement('div');
        d.className = 'f04-delta ' + KPI[i].dir;
        d.style.left = (x + 10.0) + 'px';
        d.style.top = '414.1px';
        d.style.transformOrigin = 'left center';
        if (KPI[i].dir === 'up') {
          var tri = document.createElement('i');
          tri.className = 'f04-tri';
          d.appendChild(tri);
          d.appendChild(document.createTextNode(KPI[i].d));
        } else {
          d.appendChild(document.createTextNode('-' + KPI[i].d));
        }
        kpiLayer.appendChild(d);
        deltaEls.push(d);
      }

      /* ---------- build the 12 chart-column curtains ---------- */
      var curtainLayer = root.querySelector('#f04-curtains');
      var colEls = [];
      for (var c2 = 0; c2 < 12; c2++) {
        var col = document.createElement('div');
        col.className = 'f04-col';
        col.style.left = (212.5 + 40.76 * c2) + 'px';
        curtainLayer.insertBefore(col, curtainLayer.firstChild);
        colEls.push(col);
      }

      var wordEls = root.querySelectorAll('.f04-w');

      /* ---------- timeline ---------- */
      /* Count-up rendered by a GSAP plugin, not a callback: plugin render() runs on every
         seek (including suppressEvents seeks), so the numerals are deterministic + seek-safe. */
      var PLUG = false;
      try {
        gsap.registerPlugin({
          name: 'f04num',
          init: function (target, vars) {
            this.el = target;
            this.from = 0;
            this.to = vars.to;
            this.fmt = vars.fmt;
            this._props.push('f04num');
          },
          render: function (ratio, data) {
            data.el.textContent = render(data.from + (data.to - data.from) * ratio, data.fmt);
          }
        });
        PLUG = !!(gsap.plugins && gsap.plugins.f04num);
      } catch (err) {
        PLUG = false;
      }

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* Seated states (handoff in: full-bleed, scale 1.0, opacity 1, centered).
         Applied immediately, outside the paused timeline, so frame 0 renders them. */
      gsap.set('#f04-dash', { opacity: 1, scale: 1 });
      gsap.set('#f04-var', { opacity: 0, scale: 1 });
      gsap.set('#f04-varwipe', { scaleX: 1, transformOrigin: 'right center', opacity: 0 });
      gsap.set(colEls, { scaleY: 1, transformOrigin: 'top center' });
      gsap.set(hairEls, { scaleX: 0, transformOrigin: 'left center' });
      gsap.set(deltaEls, { opacity: 0 });
      gsap.set('#f04-scrim', { opacity: 0 });
      gsap.set('#f04-underline', { scaleX: 0, transformOrigin: 'left center' });
      gsap.set('#f04-dot', { color: '#ECEAE4' });
      gsap.set(wordEls, { opacity: 0 });

      /* ================= Scene 1 (0.0-1.2) — surface swap seats, rail draws ================= */
      tl.fromTo('#f04-sweep', { y: 0, opacity: 0 }, { opacity: 0.8, duration: 0.08, ease: 'none' }, 0.0);
      tl.to('#f04-sweep', { y: 719, opacity: 0, duration: 0.42, ease: 'power1.in' }, 0.08);

      tl.fromTo('#f04-kick',
        { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.45, ease: 'power3.out' }, 0.08);
      tl.fromTo('#f04-numm', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 0.26);
      tl.fromTo('#f04-sample',
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.42, ease: 'power3.out' }, 0.38);

      tl.fromTo('#f04-railtrack',
        { scaleY: 0, transformOrigin: 'top center' },
        { scaleY: 1, duration: 0.5, ease: 'power2.inOut' }, 0.12);
      tl.fromTo('#f04-railfill',
        { scaleY: 0, transformOrigin: 'top center' },
        { scaleY: 1, duration: 0.72, ease: 'power2.out' }, 0.3);
      tl.fromTo('#f04-railnames > *',
        { opacity: 0, x: -10 },
        { opacity: 1, x: 0, duration: 0.42, stagger: 0.07, ease: 'power2.out' }, 0.24);
      tl.fromTo('#f04-rn0', { color: '#767D89' }, { color: '#F5B83D', duration: 0.25, ease: 'none' }, 0.6);
      tl.fromTo('#f04-rn1', { color: '#767D89' }, { color: '#F5B83D', duration: 0.25, ease: 'none' }, 0.92);

      /* ================= Scene 2 (1.2-4.2) — eight KPI tiles count up ================= */
      for (var k = 0; k < 8; k++) {
        (function (idx) {
          var at = 1.2 + 0.17 * idx;
          var obj = counters[idx];
          var spec = KPI[idx];
          if (PLUG) {
            tl.fromTo(valEls[idx],
              { f04num: { to: 0, fmt: spec.fmt } },
              { f04num: { to: spec.to, fmt: spec.fmt }, duration: 1.05, ease: 'power2.out' }, at);
          } else {
            tl.fromTo(obj,
              { v: 0 },
              {
                v: spec.to,
                duration: 1.05,
                ease: 'power2.out',
                onUpdate: function () {
                  valEls[idx].textContent = render(obj.v, spec.fmt);
                }
              }, at);
          }
          /* counting-dynamic-scale: the numeral grows with the value, landing at screenshot size */
          tl.fromTo(valEls[idx],
            { scale: 0.9, opacity: 0.55 },
            { scale: 1, opacity: 1, duration: 1.05, ease: 'power2.out' }, at);
          /* the tile's top hairline lights as its number lands */
          tl.fromTo(hairEls[idx],
            { scaleX: 0, transformOrigin: 'left center', opacity: 0.95 },
            { scaleX: 1, opacity: 0.6, duration: 0.3, ease: 'power2.out' }, at + 1.0);
        })(k);
      }
      /* the deltas resolve last, in the product's own green and red */
      for (var dI = 0; dI < 8; dI++) {
        tl.fromTo(deltaEls[dI],
          { opacity: 0, y: 5, scale: 0.86 },
          { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: 'back.out(2.4)' },
          3.45 + 0.075 * dI);
      }

      /* ================= Scene 3 (4.2-6.6) — bars draw up, then the hard cut ================= */
      for (var b = 0; b < 12; b++) {
        tl.to(colEls[b], { scaleY: 0, duration: 0.45, ease: 'power2.out' }, 4.25 + 0.085 * b);
      }
      /* hard cut to the variance bridges */
      tl.to('#f04-dash', { opacity: 0, duration: 0.001, ease: 'none' }, 5.75);
      tl.to('#f04-var', { opacity: 1, duration: 0.001, ease: 'none' }, 5.75);
      tl.to('#f04-kpi', { opacity: 0, duration: 0.001, ease: 'none' }, 5.75);
      tl.to(colEls, { opacity: 0, duration: 0.001, ease: 'none' }, 5.75);
      tl.to('#f04-varwipe', { opacity: 1, duration: 0.001, ease: 'none' }, 5.75);
      /* ... which draws in the same direction, so the cut carries the curve */
      tl.to('#f04-varwipe', { scaleX: 0, duration: 0.8, ease: 'power2.out' }, 5.76);

      /* ================= Scene 4 (6.6-9.0) — the statement, held ================= */
      tl.to('#f04-scrim', { opacity: 1, duration: 0.42, ease: 'power2.out' }, 6.55);
      for (var w = 0; w < wordEls.length; w++) {
        tl.fromTo(wordEls[w],
          { opacity: 0, y: 20, filter: 'blur(7px)' },
          { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power3.out' },
          6.7 + 0.13 * w);
      }
      tl.to('#f04-dot', { color: '#F5B83D', duration: 0.3, ease: 'none' }, 8.02);
      tl.to('#f04-underline', { scaleX: 1, duration: 0.6, ease: 'power2.out' }, 8.1);

      window.__timelines['04-reads-it-back'] = tl;
      tl.seek(0);
    })();
  </script>
