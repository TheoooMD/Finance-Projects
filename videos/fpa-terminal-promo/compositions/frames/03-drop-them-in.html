  <script>
    (function () {
      var AMBER = "#F5B83D";
      var tl = gsap.timeline({ paused: true });

      /* ---------- Scene 1 (0.0-1.4s): the screen seats up behind the falling chips ---------- */
      tl.fromTo(
        "#f03-screen",
        { scale: 0.96, opacity: 0.92 },
        { scale: 1, opacity: 1, duration: 1.4, ease: "power2.out" },
        0
      );

      /* ---------- Scene 1 + 2: the chips fall, then are absorbed one at a time ---------- */
      /* handoff in: 2x2 cluster centred at y = 410 (38% of 1080), scale 1, opacity 1,
         falling downward at ~340 px/s. The first 0.22s is that exact linear fall. */
      var FALL = 74.8; /* 340 px/s * 0.22s */

      var chips = [
        { el: "#f03-chip1", dx: -93.1,  dy: 158.8, land: 1.60 }, /* -> IS  */
        { el: "#f03-chip2", dx: -195.0, dy: 158.8, land: 2.30 }, /* -> BS  */
        { el: "#f03-chip4", dx: 93.1,   dy: 90.8,  land: 3.05 }, /* -> CF  */
        { el: "#f03-chip3", dx: 195.0,  dy: 349.9, land: 3.80 }  /* -> OPS */
      ];

      chips.forEach(function (c) {
        tl.fromTo(c.el, { x: 0, y: 0 }, { y: FALL, duration: 0.22, ease: "none" }, 0);
        tl.to(c.el, { x: c.dx, y: c.dy, duration: c.land - 0.22, ease: "power1.inOut" }, 0.22);
        /* absorbed into the slot */
        tl.fromTo(
          c.el,
          { scale: 1, opacity: 1 },
          { scale: 0.88, opacity: 0, duration: 0.18, ease: "power2.in" },
          c.land - 0.1
        );
      });

      /* ---------- Scene 2 (1.4-4.4s): each slot border snaps amber on its own beat ---------- */
      var strokes = [
        { el: "#f03-stroke-is",  at: 1.60 },
        { el: "#f03-stroke-bs",  at: 2.30 },
        { el: "#f03-stroke-cf",  at: 3.05 },
        { el: "#f03-stroke-ops", at: 3.80 }
      ];

      strokes.forEach(function (s) {
        tl.fromTo(
          s.el,
          { borderColor: "#3DD9A0", borderWidth: 1.1 },
          { borderColor: AMBER, borderWidth: 1.7, duration: 0.12, ease: "none" },
          s.at
        );
        tl.fromTo(
          s.el,
          { scale: 1.015 },
          { scale: 1, duration: 0.28, ease: "power2.out" },
          s.at
        );
      });

      /* ---------- Scene 3 (4.4-7.2s): the console line types on beneath the slots ---------- */
      var L1 = "> Loaded: Halcyon Cloud Systems, FY2023–FY2025";
      var L2 = "  plus 56.7K billing lines through Aug 2026";

      function build(id, text) {
        var host = document.getElementById(id);
        var out = [];
        for (var i = 0; i < text.length; i++) {
          var s = document.createElement("span");
          s.textContent = text.charAt(i);
          host.appendChild(s);
          out.push(s);
        }
        return out;
      }

      var caret = document.createElement("span");
      caret.className = "f03-caret";
      caret.textContent = "_";

      var spans = build("f03-line1", L1).concat(build("f03-line2", L2));
      document.getElementById("f03-line2").appendChild(caret);

      tl.fromTo("#f03-console-mask", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 4.40);

      var TYPE_START = 4.5;
      var TYPE_STEP = 0.0268;
      spans.forEach(function (s, i) {
        tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, TYPE_START + i * TYPE_STEP);
      });

      /* caret: present from the first typed character, blinking on a fixed grid ---------- */
      tl.fromTo(caret, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, TYPE_START);
      var t = TYPE_START + 0.42;
      var k = 0;
      while (t < 8.96) {
        tl.to(caret, { opacity: k % 2 === 0 ? 0.08 : 1, duration: 0.001, ease: "none" }, t);
        t += 0.42;
        k++;
      }

      /* ---------- Scene 4 (7.2-9.0s): all four lit, console resolved, held.
         Low-amplitude jitter on the caret only. ---------- */
      var j = 7.2;
      var jx = [0.6, -0.5, 0.4, -0.6, 0.5, -0.4, 0];
      jx.forEach(function (v, i) {
        tl.to(caret, { x: v, duration: 0.001, ease: "none" }, j + i * 0.26);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["03-drop-them-in"] = tl;
      tl.seek(0);
    })();
  </script>
